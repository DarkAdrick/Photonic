name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install UPX (optionnel)
        continue-on-error: true
        run: choco install upx -y --no-progress

      - name: Create venv_build + dependencies
        run: |
          python -m venv venv_build
          venv_build\Scripts\python.exe -m pip install --upgrade pip -q
          venv_build\Scripts\python.exe -m pip install -r requirements.txt pyinstaller -q

      - name: Get version
        id: version
        run: |
          $ver = venv_build\Scripts\python.exe -c "import backend.version, sys; sys.stdout.write(backend.version.APP_VERSION)"
          echo "ver=$ver" | Out-File -Append $env:GITHUB_OUTPUT
          echo "exe=Photonic-v$ver.exe" | Out-File -Append $env:GITHUB_OUTPUT

      - name: Build Photonic.exe
        run: venv_build\Scripts\python.exe -m PyInstaller --noconfirm Photonic.spec

      - name: Upload artifact (branche / manuel)
        uses: actions/upload-artifact@v4
        with:
          name: Photonic-windows-x64
          path: dist/${{ steps.version.outputs.exe }}

      - name: Create GitHub Release (tag uniquement)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/${{ steps.version.outputs.exe }}
          generate_release_notes: true
